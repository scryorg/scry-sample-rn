name: CI

# PR jobs: hosted runner, read-only token, no secrets (guarantee G5). Capture and upload live in
# scry-capture.yml and run only on a push to the default branch. Never pull_request_target,
# never a self-hosted runner: scripts/check-workflows.sh enforces both.
on:
  push:
    branches: [main, stage]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:types
      - run: npm test
      - name: Workflows are fork-safe (G5)
        run: bash scripts/check-workflows.sh
      - name: Bare variant builds clean
        run: |
          bash scripts/make-bare.sh "$RUNNER_TEMP/kettle-bare"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/kettle-bare/node_modules"
          (cd "$RUNNER_TEMP/kettle-bare" && npx tsc --noEmit)
